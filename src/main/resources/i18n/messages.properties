guide.0.title=Welcome to RSA-PSS Signer
guide.0.intro=Sign files so that anyone can confirm they have not changed and which key signed them. Files are not encrypted: they stay readable.
guide.0.1.title=Generate keys
guide.0.1.text=Create your private and public key, once.
guide.0.2.title=Sign
guide.0.2.text=Produce a signature for any file with your private key.
guide.0.3.title=Verify
guide.0.3.text=Check a file with its signature and the signer's public key.

guide.1.title=1. Generate your keys
guide.1.intro=Open Generate keys. You only need to do this once.
guide.1.1.title=Save as
guide.1.1.text=Pick a folder and a base name. "ana" creates ana.key and ana.pub.
guide.1.2.title=Password
guide.1.2.text=Use at least 12 characters. It cannot be recovered if you forget it.
guide.1.3.title=Keep ana.key private
guide.1.3.text=Never send it to anyone, even though it is encrypted.
guide.1.4.title=Share ana.pub
guide.1.4.text=Give the public key, and its fingerprint, to whoever will verify your files.

guide.2.title=2. Sign a file
guide.2.intro=Open Sign. Choose the file and your .key, enter your name and your password.
guide.2.1.title=The signature is a new file
guide.2.1.text=contract.pdf produces contract.pdf.sig next to it. If that signature already exists, you are asked first.
guide.2.2.title=Send three things
guide.2.2.text=The file, its .sig and your .pub.
guide.2.3.title=Your name and date are declared
guide.2.3.text=They are protected by the signature, but they are what you state, not verified facts.

guide.3.title=3. Verify a signature
guide.3.intro=Open Verify. Choose the file, its .sig and the signer's .pub. No password is needed.
guide.3.1.title=VALID
guide.3.1.text=The file is unchanged and was signed with this key.
guide.3.2.title=INVALID
guide.3.2.text=The file or the signed details changed, or the signature does not match. Do not trust it.
guide.3.3.title=ERROR
guide.3.3.text=No decision could be made, for example a damaged file or a key that is not allowed. Nothing is confirmed.

guide.4.title=Before you trust a signature
guide.4.intro=VALID proves who holds the key, not who that person is. Anyone can create a key under any name.
guide.4.1.title=Compare the fingerprint
guide.4.1.text=Check it with the signer in person or by phone, not through the channel that delivered the file.
guide.4.2.title=Protect your password
guide.4.2.text=Whoever has your .key can try passwords offline, so the password is the real protection.
guide.4.3.title=Renaming is not detected yet
guide.4.3.text=The file name is signed, but a renamed copy with the same content still verifies.
