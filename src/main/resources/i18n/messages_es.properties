guide.0.title=Te damos la bienvenida a RSA-PSS Signer
guide.0.intro=Firma archivos para que cualquiera pueda confirmar que no han cambiado y qué clave los firmó. Los archivos no se cifran: siguen siendo legibles.
guide.0.1.title=Generar claves
guide.0.1.text=Crea tu clave privada y tu clave pública, una sola vez.
guide.0.2.title=Firmar
guide.0.2.text=Genera una firma para cualquier archivo con tu clave privada.
guide.0.3.title=Verificar
guide.0.3.text=Comprueba un archivo con su firma y la clave pública del firmante.

guide.1.title=1. Genera tus claves
guide.1.intro=Abre Generar claves. Solo tienes que hacerlo una vez.
guide.1.1.title=Guardar como
guide.1.1.text=Elige una carpeta y un nombre base. "ana" crea ana.key y ana.pub.
guide.1.2.title=Contraseña
guide.1.2.text=Usa al menos 12 caracteres. Si la olvidas, no se puede recuperar.
guide.1.3.title=Mantén ana.key en privado
guide.1.3.text=Nunca se la envíes a nadie, aunque esté cifrada.
guide.1.4.title=Comparte ana.pub
guide.1.4.text=Da la clave pública, y su huella, a quien vaya a verificar tus archivos.

guide.2.title=2. Firma un archivo
guide.2.intro=Abre Firmar. Elige el archivo y tu .key, y escribe tu nombre y tu contraseña.
guide.2.1.title=La firma es un archivo nuevo
guide.2.1.text=contrato.pdf genera contrato.pdf.sig a su lado. No se sobrescribe nada.
guide.2.2.title=Envía tres cosas
guide.2.2.text=El archivo, su .sig y tu .pub.
guide.2.3.title=Tu nombre y la fecha son declarados
guide.2.3.text=La firma los protege, pero son lo que tú indicas, no hechos verificados.

guide.3.title=3. Verifica una firma
guide.3.intro=Abre Verificar. Elige el archivo, su .sig y el .pub del firmante. No hace falta contraseña.
guide.3.1.title=VÁLIDA
guide.3.1.text=El archivo no ha cambiado y se firmó con esta clave.
guide.3.2.title=INVÁLIDA
guide.3.2.text=Cambió el archivo o sus datos firmados, o la firma no coincide. No confíes en él.
guide.3.3.title=ERROR
guide.3.3.text=No se pudo decidir, por ejemplo por un archivo dañado o una clave no permitida. No queda nada confirmado.

guide.4.title=Antes de confiar en una firma
guide.4.intro=VÁLIDA demuestra quién tiene la clave, no quién es esa persona. Cualquiera puede crear una clave con cualquier nombre.
guide.4.1.title=Compara la huella
guide.4.1.text=Compruébala con el firmante en persona o por teléfono, no por el canal que te entregó el archivo.
guide.4.2.title=Protege tu contraseña
guide.4.2.text=Quien tenga tu .key puede probar contraseñas sin conexión, así que la contraseña es la verdadera protección.
guide.4.3.title=Aún no se detecta el cambio de nombre
guide.4.3.text=El nombre del archivo está firmado, pero una copia renombrada con el mismo contenido sigue verificando.
