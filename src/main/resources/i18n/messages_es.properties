keygen.size=Tamaño de la clave
keygen.bits=%d bits
keygen.repeat=Repite la contraseña
keygen.submit=Generar par de claves
keygen.hint.short=%d de al menos %d caracteres. La verdadera protección de la clave es esta contraseña.
keygen.hint.repeat=Tiene la longitud suficiente. Ahora repítela.
keygen.hint.match=Las contraseñas coinciden.
keygen.hint.mismatch=Las contraseñas todavía no coinciden.
