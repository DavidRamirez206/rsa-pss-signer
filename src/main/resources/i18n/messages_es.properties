sign.done.version=Versión del documento: %d
sign.done.format=Este formato puede ocultar contenido (macros, texto oculto, capas): la firma cubre sus bytes, no lo que ves en pantalla.
sign.done.note=Envía la firma junto con el archivo. El nombre y la fecha también quedan firmados, pero son lo que declara el firmante, no hechos verificados.

verify.title=Verificar una firma
verify.subtitle=Comprueba que un archivo no ha cambiado y que se firmó con una clave determinada.
verify.file=Archivo
verify.file.placeholder=El archivo que vas a comprobar. También puedes soltarlo aquí
verify.signature=Firma
verify.signature.placeholder=Su archivo .sig
verify.key=Clave pública
verify.key.placeholder=El archivo .pub del firmante
verify.submit=Verificar firma
verify.valid=VÁLIDA
verify.valid.detail=La firma es válida.
verify.valid.note=Esto demuestra quién tiene esta clave, no quién es esa persona. Compara la huella con el firmante por un canal independiente.
verify.invalid=INVÁLIDA
verify.invalid.detail=La firma no coincide con el archivo y sus datos firmados.
verify.invalid.note=No confíes en este archivo con esta firma.
verify.error=ERROR
verify.error.note=No se pudo decidir, así que no queda nada confirmado sobre este archivo. El detalle técnico aparece en inglés.

failure.choose.base=Elige dónde guardar las claves.
