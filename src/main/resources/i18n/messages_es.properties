failure.password.mismatch=Las contraseñas no coinciden.
failure.choose.sign=Elige el archivo que vas a firmar y la clave privada.
failure.signer=Escribe el nombre del firmante.
failure.password.wrong=Contraseña incorrecta: no se pudo abrir la clave privada.
failure.signer.control=El nombre del firmante no puede tener saltos de línea ni caracteres de control.
failure.choose.verify=Elige el archivo, su firma y la clave pública.
failure.path=Ruta no válida: %s
failure.exists=No se sobrescribió nada: %s ya existe.
failure.missing=No se encontró el archivo: %s

