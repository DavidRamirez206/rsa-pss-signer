guide.0.title=Te damos la bienvenida a RSA-PSS Signer
guide.0.intro=Firma archivos para que cualquiera pueda confirmar que no han cambiado y qué clave los firmó. Los archivos no se cifran: siguen siendo legibles.
guide.0.1.title=Generar claves
guide.0.1.text=Crea tu clave privada y tu clave pública, una sola vez.
guide.0.2.title=Firmar
guide.0.2.text=Genera una firma para cualquier archivo con tu clave privada.
guide.0.3.title=Verificar
guide.0.3.text=Comprueba un archivo con su firma y la clave pública del firmante.

guide.1.title=1. Genera tus claves
guide.1.intro=Abre Generar claves. Solo tienes que hacerlo una vez.
guide.1.1.title=Guardar como
guide.1.1.text=Elige una carpeta y un nombre base. "ana" crea ana.key y ana.pub.
guide.1.2.title=Contraseña
guide.1.2.text=Usa al menos 12 caracteres. Si la olvidas, no se puede recuperar.
guide.1.3.title=Mantén ana.key en privado
guide.1.3.text=Nunca se la envíes a nadie, aunque esté cifrada.
guide.1.4.title=Comparte ana.pub
guide.1.4.text=Da la clave pública, y su huella, a quien vaya a verificar tus archivos.

guide.2.title=2. Firma un archivo
guide.2.intro=Abre Firmar. Elige el archivo y tu .key, y escribe tu nombre y tu contraseña.
guide.2.1.title=La firma es un archivo nuevo
guide.2.1.text=contrato.pdf genera contrato.pdf.sig a su lado. Si esa firma ya existe, primero se te pregunta.
guide.2.2.title=Envía tres cosas
guide.2.2.text=El archivo, su .sig y tu .pub.
guide.2.3.title=Tu nombre y la fecha son declarados
guide.2.3.text=La firma los protege, pero son lo que tú indicas, no hechos verificados.

guide.3.title=3. Verifica una firma
guide.3.intro=Abre Verificar. Elige el archivo, su .sig y el .pub del firmante. No hace falta contraseña.
guide.3.1.title=VÁLIDA
guide.3.1.text=El archivo no ha cambiado y se firmó con esta clave.
guide.3.2.title=INVÁLIDA
guide.3.2.text=Cambió el archivo o sus datos firmados, o la firma no coincide. No confíes en él.
guide.3.3.title=ERROR
guide.3.3.text=No se pudo decidir, por ejemplo por un archivo dañado o una clave no permitida. No queda nada confirmado.

guide.4.title=Antes de confiar en una firma
guide.4.intro=VÁLIDA demuestra quién tiene la clave, no quién es esa persona. Cualquiera puede crear una clave con cualquier nombre.
guide.4.1.title=Compara la huella
guide.4.1.text=Compruébala con el firmante en persona o por teléfono, no por el canal que te entregó el archivo.
guide.4.2.title=Protege tu contraseña
guide.4.2.text=Quien tenga tu .key puede probar contraseñas sin conexión, así que la contraseña es la verdadera protección.
guide.4.3.title=Renombrar no invalida la firma
guide.4.3.text=Solo cuenta el contenido: una copia renombrada con el mismo contenido verifica. El nombre original queda en la firma.

# Comprobaciones más allá de la criptografía
note.expected=La clave coincide con la huella que esperabas.
note.certificate=Certificado emitido por "%s": esta clave pertenece a "%s", en la medida en que se confíe en esa autoridad.
note.revocation.checked=El certificado no está en la lista de revocación de la autoridad del %s.
note.revocation.unchecked=No se comprobó la revocación: no se indicó una lista de revocación.
note.follows=Sigue a %s como su siguiente versión.
note.timestamp=Sello de tiempo: esta firma existía el %s, según la autoridad %s.
note.pinned.first=Primera firma de "%s" en este equipo: su clave queda fijada, y se avisará si llega otra clave con ese nombre.
note.pinned.same=Es la misma clave fijada para "%s" en este equipo.
note.version=Versión %d del documento %s.
note.legacy=Las firmas en formato 1 no tienen versión de documento, así que no se puede detectar que presenten una versión vieja como actual.
reason.fingerprint.unexpected=La clave no es la que esperabas: se esperaba %s, pero la firma se hizo con %s
reason.certificate.name=El certificado es de "%s", pero la firma dice "%s"
reason.certificate.revoked=El certificado fue revocado el %s: ya no se puede confiar en su clave
reason.chain.broken=Esta firma no sigue a %s: no es su siguiente versión
reason.chain.version=Esta firma sigue a %s, pero dice ser la versión %d en lugar de la %d
reason.timestamp.key.missing=Para comprobar un sello de tiempo hace falta la clave pública de la autoridad
reason.timestamp.authority=El sello de tiempo lo emitió la clave %s, no la clave de autoridad indicada
reason.timestamp.signature=La firma del sello de tiempo no es válida
reason.timestamp.other=El sello de tiempo es de otro archivo de firma
reason.key.changed=La clave de "%s" cambió: este equipo fijó %s, pero esta firma se hizo con %s. Si el cambio es legítimo, confirma la nueva huella con el firmante y olvida la clave fijada.
reason.outdated=Versión desactualizada: esta es la versión %d de %s, pero en este equipo ya se verificó la versión %d
verify.forget=Olvidar la clave fijada de "%s"
verify.forget.title=¿Olvidar la clave fijada?
verify.forget.message=Hazlo solo si %s confirmó la nueva huella por otro canal.\nLa próxima firma válida con ese nombre fijará su clave.
verify.forget.confirm=Olvidar clave
verify.forgotten=Clave olvidada
verify.forgotten.detail=Verifica de nuevo para fijar la nueva clave de "%s".
failure.not.pinned=Ya no hay una clave fijada para "%s".
