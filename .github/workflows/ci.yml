name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Skips @Tag("slow") and @Tag("external") tests by default (see pom.xml)
      - name: Build and test
        run: mvn -B verify

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  slow-and-external:
    name: Slow tests and OpenSSL interop
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: OpenSSL version
        run: openssl version

      - name: Run slow + external tests
        run: mvn -B test -Dgroups=slow,external -DexcludedGroups= -Dsurefire.failIfNoSpecifiedTests=false
