name: Release

# Publishes a release when develop is merged into main: the version comes from the
# Conventional Commits since the last release (see scripts/next-version.sh), and
# commits that do not change the program publish nothing.
# Builds the Windows and Linux executables with jlink + jpackage, which cannot
# cross-compile, so each OS is packaged on its own runner.
# Running it manually builds the executables without publishing anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two quick merges must not compute the same version
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: rsa-pss-signer
  MAIN_CLASS: co.edu.icesi.signer.cli.Main

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version from commits
        id: next
        run: |
          tag="$(scripts/next-version.sh)"
          echo "Next release: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and copy dependencies
        run: mvn -B verify

      - name: Prepare jpackage input
        run: |
          mkdir -p target/package-input
          cp target/${APP_NAME}.jar target/lib/*.jar target/package-input/

      - name: Detect required JDK modules (jdeps)
        id: modules
        run: |
          MODS=$(jdeps --ignore-missing-deps --print-module-deps \
                 --multi-release 21 \
                 --class-path 'target/lib/*' target/${APP_NAME}.jar)
          echo "Modules: $MODS"
          echo "list=$MODS" >> "$GITHUB_OUTPUT"

      - name: Minimal runtime (jlink)
        run: |
          jlink --add-modules "${{ steps.modules.outputs.list }}" \
                --strip-debug --no-header-files --no-man-pages \
                --output target/runtime

      # --win-console is required: without it System.console() is null on Windows
      # and the program (by design) refuses to read the password.
      - name: Executable (jpackage app-image)
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag || 'v0.0.0' }}
        run: |
          EXTRA=()
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA+=(--win-console); fi
          VERSION="${RELEASE_TAG#v}"
          jpackage --type app-image \
                   --name "$APP_NAME" \
                   --app-version "$VERSION" \
                   --input target/package-input \
                   --main-jar "${APP_NAME}.jar" \
                   --main-class "$MAIN_CLASS" \
                   --runtime-image target/runtime \
                   --java-options "-Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8" \
                   --dest dist \
                   "${EXTRA[@]}"

      - name: Archive and compute SHA-256
        run: |
          cd dist
          ARCHIVE="${APP_NAME}-${{ matrix.platform }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "${ARCHIVE}.zip" "${APP_NAME}" > /dev/null
            sha256sum "${ARCHIVE}.zip" > "${ARCHIVE}.zip.sha256"
          else
            tar -czf "${ARCHIVE}.tar.gz" "${APP_NAME}"
            sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          fi
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release ${{ needs.version.outputs.tag }}
    needs: [version, package]
    if: github.event_name == 'push' && needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Also creates the tag; a tag created with GITHUB_TOKEN triggers no other workflow
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
