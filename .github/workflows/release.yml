name: Release

# Publishes a release when develop is merged into main, and a beta (a prerelease) on
# every push to develop: the version comes from the
# Conventional Commits since the last release (see scripts/next-version.sh), and
# commits that do not change the program publish nothing.
# Builds the Windows and Linux executables with jlink + jpackage, which cannot
# cross-compile, so each OS is packaged on its own runner.
# Running it manually builds the executables and the installer without publishing anything.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Two quick merges must not compute the same version
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: rsa-pss-signer
  MAIN_CLASS: co.edu.icesi.signer.cli.Main

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      beta: ${{ steps.next.outputs.beta }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version from commits
        id: next
        run: |
          beta=false
          args=()
          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            beta=true
            args=(--beta)
          fi
          tag="$(scripts/next-version.sh "${args[@]}")"
          echo "Next release: ${tag:-none}"
          {
            echo "tag=$tag"
            echo "beta=$beta"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and copy dependencies
        run: mvn -B verify

      - name: Prepare jpackage input
        run: |
          mkdir -p target/package-input
          cp target/${APP_NAME}.jar target/lib/*.jar target/package-input/

      - name: Detect required JDK modules (jdeps)
        id: modules
        run: |
          MODS=$(jdeps --ignore-missing-deps --print-module-deps \
                 --multi-release 21 \
                 --class-path 'target/lib/*' target/${APP_NAME}.jar)
          echo "Modules: $MODS"
          echo "list=$MODS" >> "$GITHUB_OUTPUT"

      - name: Minimal runtime (jlink)
        run: |
          jlink --add-modules "${{ steps.modules.outputs.list }}" \
                --strip-debug --no-header-files --no-man-pages \
                --output target/runtime

      # --win-console is required: without it System.console() is null on Windows
      # and the program (by design) refuses to read the password.
      - name: Executable (jpackage app-image)
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag || 'v0.0.0' }}
        run: |
          EXTRA=()
          ICON=packaging/icon/app.png
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA+=(--win-console)
            ICON=packaging/icon/app.ico
          fi
          # Installers only accept numbers, so a beta builds as the version it leads to
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION%%-*}"
          jpackage --type app-image \
                   --name "$APP_NAME" \
                   --app-version "$VERSION" \
                   --input target/package-input \
                   --main-jar "${APP_NAME}.jar" \
                   --main-class "$MAIN_CLASS" \
                   --icon "$ICON" \
                   --runtime-image target/runtime \
                   --java-options "-Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8" \
                   --add-launcher "${APP_NAME}-gui=packaging/gui-launcher.properties" \
                   --dest dist \
                   "${EXTRA[@]}"

      - name: Archive and compute SHA-256
        run: |
          cd dist
          ARCHIVE="${APP_NAME}-${{ matrix.platform }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "${ARCHIVE}.zip" "${APP_NAME}" > /dev/null
            sha256sum "${ARCHIVE}.zip" > "${ARCHIVE}.zip.sha256"
          else
            tar -czf "${ARCHIVE}.tar.gz" "${APP_NAME}"
            sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          fi
          ls -la

      # jpackage on JDK 21 builds Windows installers with WiX 3
      - name: Install WiX
        if: runner.os == 'Windows'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o wix.zip https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          echo "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31 *wix.zip" | sha256sum -c -
          7z x wix.zip -owix > /dev/null
          cygpath -w "$RUNNER_TEMP/wix" >> "$GITHUB_PATH"

      # Installs for the current user, so it needs no administrator rights. The upgrade
      # 51316a28-5a51-48ba-be71-fd256df7bab1 must never change: it is what lets a new version replace an installed one.
      # The interface is the main launcher because shortcuts follow it, and the name is
      # what people see on the shortcut and in the list of installed programs.
      - name: Windows installer (jpackage exe)
        if: runner.os == 'Windows'
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag || 'v0.0.0' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION%%-*}"
          jpackage --type exe \
                   --name "RSA-PSS Signer" \
                   --app-version "$VERSION" \
                   --vendor "ICESI" \
                   --description "RSA-PSS file signer and verifier" \
                   --input target/package-input \
                   --main-jar "${APP_NAME}.jar" \
                   --main-class co.edu.icesi.signer.gui.GuiMain \
                   --runtime-image target/runtime \
                   --java-options "-Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8" \
                   --icon packaging/icon/app.ico \
                   --add-launcher "${APP_NAME}=packaging/installer-cli-launcher.properties" \
                   --win-per-user-install \
                   --win-shortcut \
                   --win-menu \
                   --win-menu-group "RSA-PSS Signer" \
                   --win-upgrade-uuid 51316a28-5a51-48ba-be71-fd256df7bab1 \
                   --temp target/jpackage-temp \
                   --dest target/installer
          SHORTCUTS="$(grep -rhoE '<Shortcut [^>]*' target/jpackage-temp/config | grep -oE ' Name="[^"]*"' | sort | uniq -c)"
          echo "Shortcuts in the installer: $SHORTCUTS"
          # One on the desktop and one in the menu, both to the interface
          [ "$(echo $SHORTCUTS)" = '2 Name="RSA-PSS Signer"' ]
          INSTALLER="${APP_NAME}-${{ matrix.platform }}-setup.exe"
          mv target/installer/*.exe "dist/${INSTALLER}"
          cd dist
          sha256sum "$INSTALLER" > "${INSTALLER}.sha256"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release ${{ needs.version.outputs.tag }}
    needs: [version, package]
    if: github.event_name == 'push' && needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Also creates the tag; a tag created with GITHUB_TOKEN triggers no other workflow
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.beta == 'true' }}
          make_latest: ${{ needs.version.outputs.beta == 'true' && 'false' || 'true' }}
